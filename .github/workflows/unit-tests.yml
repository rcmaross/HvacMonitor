name: Analysis unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run native unit tests
        run: pio test -e native
  firmware-build:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile and link ESP32 firmware
        run: pio run -e m5stack-core2
      - name: Report ESP32 static memory sections
        shell: bash
        run: |
          ELF=".pio/build/m5stack-core2/firmware.elf"
          SIZE="$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-size"
          echo "## ESP32 static memory sections" >> "$GITHUB_STEP_SUMMARY"
          echo 'These are linker-assigned static section sizes, not runtime free heap or peak usage.' >> "$GITHUB_STEP_SUMMARY"
          echo 'DRAM includes initialized and zero-initialized static data; IRAM is instruction memory.' >> "$GITHUB_STEP_SUMMARY"
          echo 'External PSRAM allocated dynamically is not reflected as runtime usage here.' >> "$GITHUB_STEP_SUMMARY"
          echo '### Allocated sections (bytes)' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          "$SIZE" -A "$ELF" | tee /tmp/esp32-sections.txt
          grep -E '^\.(dram0|iram0|flash|ext_ram|noinit)' /tmp/esp32-sections.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          echo '### Total ELF sections' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          "$SIZE" "$ELF" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
