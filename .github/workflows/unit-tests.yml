name: Analysis unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run native unit tests
        run: pio test -e native
  firmware-build:
    needs: native-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile and link ESP32 firmware
        run: pio run -e m5stack-core2
      - name: Verify embedded development build metadata
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          header = pathlib.Path('include/generated/build_info.h').read_text()
          version = re.search(r'^#define HVAC_FW_VERSION "([^"]+)"', header, re.M).group(1)
          sha = re.search(r'^#define HVAC_FW_SHA "([^"]+)"', header, re.M).group(1)
          expected_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == expected_sha, (sha, expected_sha)
          assert re.fullmatch(r'v\d+\.\d+\.\d+-dev\.[0-9a-f]{8}', version), version
          binary = pathlib.Path('.pio/build/m5stack-core2/firmware.bin').read_bytes()
          assert version.encode() in binary, f'Firmware image missing version {version}'
          assert sha.encode() in binary, f'Firmware image missing SHA {sha}'
          print(f'Verified firmware.bin: {version}, commit {sha}')
          PY
      - name: Publish development firmware
        uses: actions/upload-artifact@v4
        with:
          name: hvac-monitor-dev-${{ github.sha }}
          path: .pio/build/m5stack-core2/firmware.bin
          retention-days: 30
      - name: Report ESP32 static memory sections
        shell: bash
        run: |
          ELF=".pio/build/m5stack-core2/firmware.elf"
          SIZE="$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-size"
          "$SIZE" -A "$ELF" > /tmp/esp32-sections.txt
          python - <<'PY'
          from pathlib import Path
          sections = {}
          for line in Path('/tmp/esp32-sections.txt').read_text().splitlines():
              fields = line.split()
              if len(fields) >= 3 and fields[0].startswith('.'):
                  try:
                      sections[fields[0]] = int(fields[1])
                  except ValueError:
                      continue
          if not sections.get('.dram0.data') and not sections.get('.dram0.bss'):
              raise SystemExit('ERROR: no internal DRAM sections found in firmware ELF')
          groups = {
              'Internal DRAM (.dram0.*)': '.dram0.',
              'Instruction RAM (.iram0.*)': '.iram0.',
              'Flash code (.flash.text*)': '.flash.text',
              'Flash constants (.flash.rodata*)': '.flash.rodata',
              'External RAM (.ext_ram*)': '.ext_ram',
          }
          rows = [(name, sum(size for section, size in sections.items() if section.startswith(prefix)))
                  for name, prefix in groups.items()]
          report = ['## ESP32 static memory summary', '',
                    '| Region | Bytes | KiB |', '|---|---:|---:|']
          for name, size in rows:
              report.append(f'| {name} | {size:,} | {size / 1024:,.1f} |')
          report += ['', 'Linker-assigned static sections only; does not measure runtime heap,',
                     'stack usage, or dynamically allocated PSRAM.']
          output = '\n'.join(report) + '\n'
          print(output)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(output)
          PY
