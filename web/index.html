<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HVAC Monitor</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #101418;
            color: #F2F4F5;
            font-family: Arial, sans-serif;
        }

        .app {
            display: grid;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }

        .header {
            background: #181D22;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            border-bottom: 1px solid #303840;
        }

        .header-center {
            text-align: center;
        }

        .header-right {
            text-align: right;
        }

        .body {
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr);
            min-height: 0;
        }

        .navigation {
            background: #181D22;
            padding-top: 20px;
            border-right: 1px solid #303840;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: #AEB7BF;
            cursor: pointer;
            font-size: 16px;
        }

        .nav-icon {
            display: block;
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
        }

        .nav-item:hover {
            background: #20272D;
            color: #F2F4F5;
        }

        .nav-item.active {
            background: #252D34;
            color: #F2F4F5;
        }

        .content {
            overflow: auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div id="wifi">Wi-Fi</div>
        <div id="time" class="header-center">--:--</div>
        <div class="header-right">100%</div>
    </div>

    <div class="body">

        <div class="navigation">
            <div class="nav-item" onclick="showPage('analysis', '/analysis')"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 16v-3M12 16V8M17 16v-6"/></svg>ANALYSIS</div>
            <div class="nav-item active"
                 onclick="showPage('status', '/status')">
                <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg>STATUS
            </div>

            <div class="nav-item"
                onclick="showPage('history', '/history')">
                <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>HISTORY
            </div>            
            
            <div class="nav-item">
                <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>SETTINGS
            </div>

            <div class="nav-item">
                <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.2a10 10 0 0 1 14 0M8.5 15.7a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>NETWORK
            </div>
            <div class="nav-item" onclick="showPage('firmware', '/firmware')"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>FIRMWARE</div>
        </div>

        <div class="content">
            <iframe id="content-frame" src="/status"></iframe>
        </div>

    </div>

</div>

<script>
function showPage(name, url)
{
    document.getElementById("content-frame").src = url;

    document.querySelectorAll(".nav-item").forEach(function(item) {
        item.classList.remove("active");
    });

    event.currentTarget.classList.add("active");
}

async function updateHeader()
{
    try {
        const response = await fetch("/api/status");
        const data = await response.json();

        document.getElementById("wifi").textContent =
            data.rssi + " dBm";

        document.getElementById("time").textContent =
            data.time;
    }
    catch (error) {
        console.log(error);
    }
}

updateHeader();

setInterval(
    updateHeader,
    1000
);
</script>

</body>
</html>
