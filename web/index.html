<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HVAC Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #101418;
            color: #F2F4F5;
            font-family: Arial, sans-serif;
        }

        .app {
            display: grid;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }

        .header {
            background: #181D22;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            border-bottom: 1px solid #303840;
        }

        .header-center {
            text-align: center;
        }

        .header-right {
            text-align: right;
        }

        .body {
            display: grid;
            grid-template-columns: 160px 1fr;
            min-height: 0;
        }

        .navigation {
            background: #181D22;
            padding-top: 20px;
            border-right: 1px solid #303840;
        }

        .nav-item {
            padding: 14px 20px;
            color: #AEB7BF;
            cursor: pointer;
            font-size: 16px;
        }

        .nav-item:hover {
            background: #20272D;
            color: #F2F4F5;
        }

        .nav-item.active {
            background: #252D34;
            color: #F2F4F5;
        }

        .content {
            overflow: auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div id="wifi">Wi-Fi</div>
        <div id="time" class="header-center">--:--</div>
        <div class="header-right">100%</div>
    </div>

    <div class="body">

        <div class="navigation">
            <div class="nav-item active"
                 onclick="showPage('status', '/status')">
                STATUS
            </div>

            <div class="nav-item">
                HISTORY
            </div>

            <div class="nav-item">
                SETTINGS
            </div>

            <div class="nav-item">
                NETWORK
            </div>
        </div>

        <div class="content">
            <iframe id="content-frame" src="/status"></iframe>
        </div>

    </div>

</div>

<script>
function showPage(name, url)
{
    document.getElementById("content-frame").src = url;

    document.querySelectorAll(".nav-item").forEach(function(item) {
        item.classList.remove("active");
    });

    event.currentTarget.classList.add("active");
}

async function updateHeader()
{
    try {
        const response = await fetch("/api/status");
        const data = await response.json();

        document.getElementById("wifi").textContent =
            data.rssi + " dBm";

        document.getElementById("time").textContent =
            data.time;
    }
    catch (error) {
        console.log(error);
    }
}

updateHeader();

setInterval(
    updateHeader,
    1000
);
</script>

</body>
</html>
