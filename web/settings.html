<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101418;color:#f2f4f5;font:16px Arial,sans-serif;padding:25px}label{display:block;margin-bottom:12px}input{padding:10px;font-size:18px;width:120px}button{padding:11px 20px;margin-left:10px;background:#315c81;color:white;border:0;border-radius:4px}#result{margin-top:15px}</style></head><body><h2>Settings</h2><form id="form"><label for="zipcode">Outdoor weather ZIP code</label><input id="zipcode" name="zipcode" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="5-digit ZIP"><button>Save</button></form><p id="result"></p><script>fetch('/api/settings').then(r=>r.json()).then(d=>document.getElementById('zipcode').value=d.zipcode||'');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body=new URLSearchParams({zipcode:document.getElementById('zipcode').value});const r=await fetch('/api/settings',{method:'POST',body});document.getElementById('result').textContent=r.ok?'Saved':'Invalid ZIP code';});</script></body></html>
