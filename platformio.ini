; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32@7.1.3
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-5B212257601
monitor_port = /dev/cu.usbserial-5B212257601

lib_deps =
    m5stack/M5Unified@0.2.25
    lvgl/lvgl@9.6.0

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

extra_scripts =
    pre:scripts/build_info.py
    pre:scripts/generate_web.py

;[env:m5stack-core2-ota]
;extends = env:m5stack-core2

;upload_protocol = espota
;upload_port = hvac-monitor.local
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -I src
